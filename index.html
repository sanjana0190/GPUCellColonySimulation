<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGPU Cell Colony Simulation</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #0a0a0f;
      }

      #controls {
        position: fixed;
        top: 10px;
        left: 10px;
        background: rgba(20, 20, 30, 0.8);
        padding: 10px;
        border-radius: 8px;
        color: white;
        font-family: sans-serif;
      }

      button {
        margin-right: 8px;
      }

      .color-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
      }

      .color-row label {
        min-width: 4.5rem;
        font-size: 0.85rem;
      }

      .color-row input[type='color'] {
        width: 2.25rem;
        height: 1.75rem;
        padding: 0;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <canvas id="gpu-canvas"></canvas>
    <div id="controls">
      <button id="toggle">Pause</button>
      <button id="reset">Reset</button>

      <label>
        Speed
        <input id="speed" type="range" min="10" max="500" value="100" />
      </label>

      <div class="color-row">
        <label for="color-dead">Dead</label>
        <input id="color-dead" type="color" value="#050508" />
      </div>
      <div class="color-row">
        <label for="color-alive">Alive</label>
        <input id="color-alive" type="color" value="#33cc44" />
      </div>
      <div class="color-row">
        <label for="color-dividing">Dividing</label>
        <input id="color-dividing" type="color" value="#ffff66" />
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
